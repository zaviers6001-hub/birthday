<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Little moments worth remembering."
    >

    <title>Little Moments 🌻</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-page="memories">

    <div class="ambient-background" aria-hidden="true">
        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <div class="cloud cloud-three"></div>
        <div class="ambient-particles" id="ambientParticles"></div>
    </div>


    <!-- NAVIGATION -->
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">

            <a href="index.html" class="nav-brand">
                <span class="brand-flower">🌻</span>
                <span>A Little Birthday Gift Made by Zapier :></span>
            </a>

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="nav-links" id="navLinks">

                <a href="index.html" class="nav-link">
                    Home
                    <span class="nav-indicator">🌻</span>
                </a>

                <a href="memories.html" class="nav-link active">
                    Memories
                    <span class="nav-indicator">🌻</span>
                </a>

                <a href="letter.html" class="nav-link">
                    Letter
                    <span class="nav-indicator">🌻</span>
                </a>

                <a href="wishes.html" class="nav-link">
                    Wishes
                    <span class="nav-indicator">🌻</span>
                </a>

                <a href="surprise.html" class="nav-link">
                    Surprise
                    <span class="nav-indicator">🌻</span>
                </a>

            </div>
        </nav>
    </header>


   
    <main id="pageContent">

        <section class="page-section memories-section">

            <div class="section-heading reveal">

                <p class="eyebrow">
                    Chapter one
                </p>

                <h1>
                    Some Picture about YOU
                    <span>🌻</span>
                </h1>

                <p>
                    :3
                </p>

            </div>


            <!-- Memory cards are generated by JavaScript -->
            <div
                class="memory-grid"
                id="memoryGrid"
                aria-live="polite"
            ></div>

        </section>

    </main>


    <!-- MEMORY MODAL -->
    <div
        class="modal"
        id="memoryModal"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >

        <div class="modal-backdrop" data-modal-close></div>

        <div class="modal-card">

            <button
                class="modal-close"
                id="modalClose"
                type="button"
                aria-label="Close memory"
            >
                ×
            </button>

            <div class="modal-image-wrap">
                <img
                    id="modalImage"
                    src=""
                    alt=""
                >
            </div>

            <div class="modal-content">

                <p class="modal-date" id="modalDate"></p>

                <h2 id="modalTitle"></h2>

                <p id="modalDescription"></p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>
</body>
</html>
